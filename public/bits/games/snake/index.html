<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Snake · Bits arcade · Vashisth Patel</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="../shared/arcade.css" />
    <style>
      :root { --game-bg: #000; --game-fg: #fff; --game-accent: #39ff88; }
      .board {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255, 255, 255, 0.06);
        transition: box-shadow 0.25s, border-color 0.25s;
      }
      .board.is-level { border-color: #fff; box-shadow: 0 0 0 1px #000, 0 0 46px rgba(255, 255, 255, 0.35); }
      .msg { background: rgba(0, 0, 0, 0.74); }
      .toast { background: #fff; color: #000; }

      .dpad {
        display: none;
        grid-template-columns: repeat(3, 58px);
        grid-template-rows: repeat(3, 50px);
        gap: 6px;
        padding: 6px 0 2px;
        touch-action: none;
      }
      .dpad button {
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 20px;
        line-height: 1;
        touch-action: none;
      }
      .dpad button:active, .dpad button.is-down { background: #fff; color: #000; }
      .dpad .up { grid-area: 1 / 2; }
      .dpad .left { grid-area: 2 / 1; }
      .dpad .right { grid-area: 2 / 3; }
      .dpad .down { grid-area: 3 / 2; }
      .dpad .pause { grid-area: 2 / 2; font-size: 12px; border-style: dashed; opacity: 0.7; }
      @media (pointer: coarse), (max-width: 600px) {
        .dpad { display: grid; }
      }
    </style>
  </head>
  <body>
    <header class="hud">
      <span>Score <b data-score>0</b> · Level <b data-level>1</b></span>
      <span class="hud-right">
        <span class="hud-dim">Best <b data-best>0</b></span>
        <button type="button" class="mute" data-mute aria-pressed="false">sound: on</button>
      </span>
    </header>

    <main class="stage" data-stage>
      <div class="board" data-board>
        <canvas data-canvas role="img" aria-label="Snake playfield: a white snake on a black 30 by 30 grid"></canvas>
        <div class="msg" data-msg>
          <div class="msg-title" data-msg-title>SNAKE</div>
          <p class="msg-sub" data-msg-sub></p>
        </div>
        <div class="toast" data-toast aria-hidden="true"></div>
      </div>
    </main>

    <div class="dpad" data-dpad aria-label="Direction pad">
      <button type="button" class="up" data-dir="up" aria-label="Up"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" style="transform:rotate(0deg)"><path d="M10 4 L17 15 H3 Z" fill="currentColor"/></svg></button>
      <button type="button" class="left" data-dir="left" aria-label="Left"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" style="transform:rotate(-90deg)"><path d="M10 4 L17 15 H3 Z" fill="currentColor"/></svg></button>
      <button type="button" class="pause" data-pause aria-label="Pause or resume">II</button>
      <button type="button" class="right" data-dir="right" aria-label="Right"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" style="transform:rotate(90deg)"><path d="M10 4 L17 15 H3 Z" fill="currentColor"/></svg></button>
      <button type="button" class="down" data-dir="down" aria-label="Down"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" style="transform:rotate(180deg)"><path d="M10 4 L17 15 H3 Z" fill="currentColor"/></svg></button>
    </div>

    <footer class="foot">
      Snake · original: Python turtle, 2022 · remastered for the browser, 2026
      <a class="back-link" href="../../">← back to the terminal</a>
    </footer>
    <p class="sr-only" aria-live="polite" data-live></p>

    <script src="../shared/arcade.js"></script>
    <script src="snake.js"></script>
  </body>
</html>
